version: "3.9"

services:

  postgres:

    ports: []
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus:   '1.0'

  redis:
    ports: []
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus:   '0.5'

  migrate:
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      DIRECT_URL:   "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"

  api:
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      DIRECT_URL:   "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"

    ports: []
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus:   '0.5'
    healthcheck:
      test:     ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 30s

  fraud-consumer:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus:   '0.25'

  ledger-consumer:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus:   '0.25'

  projection-consumer:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus:   '0.25'

  webhook-consumer:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus:   '0.25'

  dlq-worker:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m
          cpus:   '0.1'

  compensation-worker:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m
          cpus:   '0.1'

  payout-cron:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m
          cpus:   '0.1'

  reconciliation-cron:
    env_file:      [.env.production]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_engine"
      REDIS_URL:    "redis://redis:6379"
      NODE_ENV:     "production"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m
          cpus:   '0.1'

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"

    volumes:

      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 64m
          cpus:   '0.1'
