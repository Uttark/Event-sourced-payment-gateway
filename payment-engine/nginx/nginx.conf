upstream express_api {
    server api:3001;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    add_header X-Frame-Options SAMEORIGIN always;

    add_header X-Content-Type-Options nosniff always;

    add_header X-XSS-Protection "1; mode=block" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip            on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types
        application/json
        text/plain
        text/css
        application/javascript;

    location /api/ {
        proxy_pass         http://express_api;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /health {
        proxy_pass         http://express_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        access_log off;
    }

    location = /api/preflight {
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Admin-Key";
        add_header Content-Length 0;
        return 204;
    }

    location / {
        default_type application/json;
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"This server only handles /api/* requests."}}';
    }
}
